# Unsloth Qwen3.6-35B-A3B MTP (MoE). Path is relative to the platform models dir:
#   Windows: %LOCALAPPDATA%\malaikat\models
#   Linux:   ~/.local/share/malaikat/models
# ctx_size 0 = model max (262144). On Linux, malaikat passes --fit off so
# llama.cpp cannot silently shrink that window. Windows lemonade is unchanged.
# Shared knobs: MTP n-max=3 + FA on + KV q8_0 + 2048/1024 batch.
# Linux also sets ROCR_VISIBLE_DEVICES=0 and ROCBLAS_USE_HIPBLASLT=1 at runtime.
# Windows uses HIGH_PRIORITY_CLASS (high_priority default true).

model: Qwen3.6-35B-A3B-MTP/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
alias: qwen3.6-35b-a3b-mtp
host: 127.0.0.1
port: 8080
ctx_size: 0
batch: 2048
ubatch: 1024
n_gpu_layers: 999
parallel: 1
jinja: true

flash_attn: on
cache_type_k: q8_0
cache_type_v: q8_0

spec_type: draft-mtp
spec_draft_n_max: 3

env:
  HIP_VISIBLE_DEVICES: "0"
