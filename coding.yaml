# Ornith-1.5-35B-A3B (MoE, ~3B active). Path is relative to the platform models dir:
#   Windows: %LOCALAPPDATA%\malaikat\models
#   Linux:   ~/.local/share/malaikat/models
#
# Context on launch (CLI wins over this file):
#   ./malaikat serve -config ./coding.yaml -c 256k
#   ./malaikat serve -config ./coding.yaml -c 512k
#   ./malaikat serve -config ./coding.yaml -c 1m
#
# 256k is native (262144). 512k and 1m turn on YaRN automatically
# (--rope-scaling yarn + GGUF context_length override so llama.cpp does not cap).
# On Linux, malaikat also passes --fit off so the window is not silently shrunk.
#
# Download: python3 scripts/download_ornith15.py
# Shared knobs: MTP n-max=3 + FA on + KV q8_0 + 2048/1024 batch.

model: Ornith-1.5-35B-A3B/Ornith-1.5-35B-Q4_K_M.gguf
alias: ornith-1.5-35b-a3b
host: 127.0.0.1
port: 8080
ctx_size: 256k
native_ctx: 262144
rope_arch: qwen35moe
batch: 2048
ubatch: 1024
n_gpu_layers: 999
parallel: 1
jinja: true

flash_attn: on
cache_type_k: q8_0
cache_type_v: q8_0

spec_type: draft-mtp
spec_draft_n_max: 3

env:
  HIP_VISIBLE_DEVICES: "0"
  # ROCm tuning: more command queues + compute-path copies; small, stable
  # decode/prefill speedup on Strix Halo gfx1151 (verified ~1-3% on ornith-1.5-35b-a3b).
  GPU_MAX_HW_QUEUES: "16"
  HSA_ENABLE_SDMA: "0"
