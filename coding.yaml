# Unsloth Qwen3.8-27B MTP (dense hybrid qwen35) via malaikat ROCm (Linux).
# UD-Q4_K_XL Dynamic V3.0 — recommended 4-bit; native MTP head (no separate drafter).
# Strix Halo knobs: MTP n-max=3 + FA on + KV q8_0 + 2048/1024 batch.
# Switch back: malaikat serve -config coding-qwen36.yaml

model: ~/.local/share/malaikat/models/Qwen3.8-27B-MTP/Qwen3.8-27B-UD-Q4_K_XL.gguf
alias: qwen3.8-27b-mtp
host: 127.0.0.1
port: 8080
ctx_size: 0
batch: 2048
ubatch: 1024
n_gpu_layers: 999
parallel: 1
jinja: true

flash_attn: on
cache_type_k: q8_0
cache_type_v: q8_0

spec_type: draft-mtp
spec_draft_n_max: 3

env:
  HIP_VISIBLE_DEVICES: "0"
  ROCR_VISIBLE_DEVICES: "0"
